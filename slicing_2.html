<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slicing ke 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container log-in">
        <!-- INI BUAT BAGIAN KIRI -->
        <div class="row log-card rounded">
            <div class="col-md-6 p-5">
                <h2 class="mb-2 fw-bold title-font">WELCOME BACK !!</h2>
                <p class="text-muted mb-4">The Faster You Fill Up,The Faster You Get A Ticket</p>
              
                <!-- ini buat kolom formnya -->
                 <!-- ini email -->
              <div class="mb-3">
                 <label for="email" class="form-label">Email</label>
                 <input type="email" class="form-control" id="email" placeholder="Enter your email">
              </div>

              <!-- ini password -->
               <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="******">
               </div>

               <!-- ini buat checkbox -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label for="rememberMe" class="form-check-label">Remember Me</label>
                    </div>
                    <a href="#" class="text-decoration-none">forgot password?</a>
                </div>

                <!-- ini buat buttonnya -->
                 <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-dark">Sign In</button>
                    <button type="button" class="btn btn-outline-dark">
                        <img src="https://img.icons8.com/color/16/000000/google-logo.png" alt="google"> Sign In With Google
                    </button>
                 </div>

                 <!-- ini text yng ada di bawah -->
             <p class="mt-5 text-center text-muted">Don't have an account? <a href="#" class="text-decoration-none">Sign Up</a></p>
            </div>

            <!-- INI BAGIAN KANAN FOTO -->
             <div class="col-md-6 foto-kanan d-flex  justify-content-end">
                <img src="Screenshot 2025-08-01 154709.png" class="img-fluid" alt="pemandangan">
             </div>
        </div>
    </div>
   


    <script src="bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
