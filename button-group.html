<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan button group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .group-margin{
            margin-top: 40px;
            margin-left: 30px;
        }
    </style>
</head>
<body>
    <div class="btn-group group-margin" role="group" aria-label="Basic outlined example">
        <button type="button" class="btn btn-outline-success">Satu</button>
        <button type="button" class="btn btn-outline-success">Dua</button>
        <button type="button" class="btn btn-outline-success">Tiga</button>
    </div>
    <br>
    <div class="btn-group group-margin" role="group" aria-label="Basic radio toggle button group">
        <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off">
        <label class="btn btn-outline-success" for="btnradio1">Radio 1</label>

        <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
        <label class="btn btn-outline-success" for="btnradio2">Radio 2</label>
    </div>
    <div class="btn-group group-margin" role="group">
        <button type="button" class="btn btn-success dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            Dropdown
        </button>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">link-1</a></li>
            <li><a class="dropdown-item" href="#">link-2</a></li>
        </ul>
    </div>
    <div class="input-group group-margin w-25 p-3">
        <div class="input-group-text" id="btnGroupAddon">@</div>
        <input type="text" class="form-control" placeholder="masukan data anda" aria-label="Input group example" aria-describedby="btnGroupAddon">
    </div>
    
    


    
    <script src="bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
