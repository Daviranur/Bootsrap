<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan list group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .list-margin{
            margin-top: 30px;
            margin-left: 28px;
        }
    </style>
</head>
<body>
    <div class="list-group w-50 p-3 list-margin">
        <button type="button" class="list-group-item list-group-item-action list-group-item-danger" aria-current="true">
            the current button</button>
            <button type="button" class="list-group-item list-group-item-action">the second button</button>
            <button type="button" class="list-group-item list-group-item-action">the third button</button>
            <button type="button" class="list-group-item list-group-item-action">the fourth button</button>
            <button type="button" class="list-group-item list-group-item-action" disabled>disabled button</button>
    </div>



    <script src="bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
