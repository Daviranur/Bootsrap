<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan buttons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
   
    <style>
        .btn-margin{
            margin-top: 40px;
            margin-left: 30px;
        }
    </style>
</head>
<body>
    <button type="button" class="btn btn-secondary btn-margin">click</button>
    <input  class="btn btn-primary btn-margin" type="button" value="click">
    <br>
    <p class="d-inline-flex gap-1">
        <button type="button" class="btn btn-outline-success btn-margin" data-bs-toggle="button" aria-pressed="true">toggle button</button>
    </p>

    <script src="bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
