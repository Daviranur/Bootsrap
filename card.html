<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .card-margin{
            margin-top: 40px;
            margin-left: 30px;
        }
    </style>
</head>
<body>
    <div class="card card-margin rounded-4" style="width: 18rem;">
        <img src="wllpp new.avif" class="card-img-top rounded-top-4" alt="pemandangan">
        <div class="card-body">
            <h5 class="card-title">Mountain</h5>
            <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
            <a href="#" class="btn btn-success">click</a>
        </div>
    </div>
    <div class="card card-margin rounded-4 align-text-bottom" style="width: 18rem;">
        <div class="card-body">
            <h5 class="card-title">Mountain</h5>
            <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
            <a href="#" class="btn btn-success">click</a>
        </div>
        <img src="wllpp new.avif" class="card-img-bottom rounded-bottom-4" alt="pemandangan">
    </div>



    <script src="bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
