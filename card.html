<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .card-margin{
            margin-top: 40px;
            margin-left: 30px;
        }
    </style>
</head>
<body>
    <div class="card card-margin rounded-4" style="width: 18rem;">
        <img src="wllpp new.avif" class="card-img-top rounded-top-4" alt="pemandangan">
        <div class="card-body">
            <h5 class="card-title">Mountain</h5>
            <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
            <a href="#" class="btn btn-success">click</a>
        </div>
    </div>
    <div class="card mb-3 card-margin" style="max-width: 520px;">
        <div class="row g-0">
            <div class="col-md-4">
                <img src="wllpp new.avif" class="img-fluid rounded-start" alt="pemandangan">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title">Mountain</h5>
                    <p class="card-text">This is a wider card with supporting text below as a natural lead-in to additional content. This content is a little bit longer.</p>
                    <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
                </div>
            </div>
        </div>
    </div>


    <script src="bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
